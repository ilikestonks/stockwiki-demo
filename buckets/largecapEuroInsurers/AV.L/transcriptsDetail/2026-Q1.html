    if (toggleIcon) { toggleIcon.addEventListener("click", function(){}); }

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const password = document.getElementById("staticrypt-password").value;
      // remember = always true (we always want the 14-day cookie behaviour)
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, true);
      if (!isSuccessful) {
        // brief shake + clear input instead of alert dialog
        const input = document.getElementById("staticrypt-password");
        input.value = "";
        input.style.borderColor = "#c0392b";
        setTimeout(() => { input.style.borderColor = ""; }, 800);
      }
    });
  </script>
</body>
</html>
