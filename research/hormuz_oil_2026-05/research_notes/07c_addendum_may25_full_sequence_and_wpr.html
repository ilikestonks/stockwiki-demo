        // brief shake + clear input instead of alert dialog
        const input = document.getElementById("staticrypt-password");
        input.value = "";
        input.style.borderColor = "#c0392b";
        setTimeout(() => { input.style.borderColor = ""; }, 800);
      }
    });
  </script>
</body>
</html>
